# Nightly encrypted database backup, kept for 30 days.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL       the Supabase connection string (Session pooler, port 5432, or direct)
#   BACKUP_PASSPHRASE  a long private phrase. Keep a copy somewhere safe: without it a backup can't be opened.
name: Database backup
on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 in India every night
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Back up and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: scripts/backup.sh backups
      - uses: actions/upload-artifact@v4
        with:
          name: bet-db-backup-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 30
          if-no-files-found: error
